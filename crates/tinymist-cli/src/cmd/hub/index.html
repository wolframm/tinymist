<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typst</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typst">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f6f6f4;
  --card: #fff;
  --fg: #1c1c1e;
  --muted: #86868b;
  --line: rgba(0, 0, 0, 0.08);
  --accent: #2b6cd6;
  --press: rgba(0, 0, 0, 0.05);
  --star: #d99a00;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111;
    --card: #1c1c1e;
    --fg: #ececee;
    --muted: #98989d;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #7aa7ff;
    --press: rgba(255, 255, 255, 0.06);
    --star: #f0b429;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.3 -apple-system, system-ui, "Segoe UI", sans-serif;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
#q {
  width: 100%;
  padding: 9px 12px;
  font: inherit;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
#q:focus { border-color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 4px 16px 32px; }
h2 {
  margin: 22px 4px 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.list {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding: 7px 8px 7px 14px;
  color: inherit;
  text-decoration: none;
  border-top: 1px solid var(--line);
  -webkit-tap-highlight-color: transparent;
}
.row:first-child { border-top: 0; }
.row:active { background: var(--press); }
.row svg.kind { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.row.doc svg.kind { stroke: var(--accent); }
.text { flex: 1; min-width: 0; }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.when { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-right: 6px; }
.star {
  flex: none;
  width: 40px;
  height: 40px;
  padding: 9px;
  border: 0;
  background: none;
  color: var(--muted);
  -webkit-tap-highlight-color: transparent;
}
.star svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
.star.on { color: var(--star); }
.star.on svg { fill: currentColor; }
.hint { padding: 14px; color: var(--muted); font-size: 14px; }
.crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; margin: 16px 4px 8px; font-size: 15px; }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs span.sep { color: var(--muted); }
.crumbs .here { font-weight: 600; }
.crumbs .star { margin-left: auto; }
#status {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 3;
  padding: 11px 14px;
  border-radius: 12px;
  background: rgba(30, 30, 30, 0.94);
  color: #f2f2f2;
  font-size: 14px;
  text-align: center;
}
</style>
</head>
<body>
<header><input id="q" type="search" placeholder="Search the favourites" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></header>
<main id="view"></main>
<div id="status" hidden></div>
<script>
"use strict";
// The hub's home (tinymist hub): favourite folders, the documents changed
// last, a search over the favourites, and a browser of the documents folder.
// A document opens as /v/<path>; a folder is #/browse/<path>.

const view = document.getElementById("view");
const q = document.getElementById("q");
const statusEl = document.getElementById("status");

const ICON = {
  folder: '<svg class="kind" viewBox="0 0 24 24"><path d="M3 7.5V18a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V9a1.5 1.5 0 0 0-1.5-1.5h-7.2L10.5 5h-6A1.5 1.5 0 0 0 3 6.5z"/></svg>',
  doc: '<svg class="kind" viewBox="0 0 24 24"><path d="M6.5 3h7.5l4.5 4.5V20a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M14 3v4.5h4.5 M8.5 12h7 M8.5 15h7 M8.5 18h4.5"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/></svg>',
};

let home = null; // { favorites: [{path, exists}], files: [{path, mtime}] }
let folder = null; // the folder being shown: { dir, favorite, entries }
let retry = 0;

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const enc = (rel) => rel.split("/").map(encodeURIComponent).join("/");
const fold = (s) => s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
const base = (p) => (p ? p.slice(p.lastIndexOf("/") + 1) : "Documents");
const parent = (p) => (p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "");
const stem = (name) => name.replace(/\.typ$/, "");

function when(sec) {
  if (!sec) return "";
  const t = new Date(sec * 1000);
  const now = new Date();
  const ago = (now - t) / 1000;
  if (ago < 60) return "now";
  if (ago < 3600) return `${Math.floor(ago / 60)} min`;
  const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = Math.round((day(now) - day(t)) / 86400000);
  if (days === 0) return t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (days === 1) return "yesterday";
  if (days < 7) return t.toLocaleDateString([], { weekday: "short" });
  return t.toLocaleDateString([], { day: "numeric", month: "short", year: t.getFullYear() === now.getFullYear() ? undefined : "numeric" });
}

class Unreachable extends Error {}

async function api(path, options) {
  let res;
  try {
    res = await fetch(path, { cache: "no-store", ...options });
  } catch (_) {
    throw new Unreachable("Can't reach the Mac — asleep, offline, or Tailscale is off.");
  }
  if (res.status >= 502 && res.status <= 504) throw new Unreachable("The Mac answers, the preview hub does not.");
  if (res.status === 403) throw new Unreachable("Not allowed: open this through Tailscale, signed in as yourself.");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function showStatus(text) {
  statusEl.hidden = !text;
  statusEl.textContent = text || "";
}

function row({ href, kind, name, sub, when: w, star }) {
  const starHtml = star === undefined ? "" :
    `<button class="star${star.on ? " on" : ""}" data-path="${esc(star.path)}" aria-label="${star.on ? "Remove from" : "Add to"} favourites">${ICON.star}</button>`;
  return `<a class="row ${kind}" href="${esc(href)}">${ICON[kind]}<div class="text"><div class="name">${esc(name)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>${w ? `<div class="when">${esc(w)}</div>` : ""}${starHtml}</a>`;
}

const docRow = (path, mtime) =>
  row({ href: `/v/${enc(path)}`, kind: "doc", name: stem(base(path)), sub: parent(path), when: when(mtime) });
const folderHref = (path) => `#/browse/${enc(path)}`;
const isFavorite = (path) => !!home && home.favorites.some((f) => f.path === path);

function renderHome() {
  const favs = home.favorites.filter((f) => f.exists);
  let html = "<h2>Favourites</h2><div class=\"list\">";
  html += favs.length
    ? favs.map((f) => row({ href: folderHref(f.path), kind: "folder", name: base(f.path), sub: parent(f.path), star: { path: f.path, on: true } })).join("")
    : '<div class="hint">Star a folder to keep it here.</div>';
  html += "</div>";
  if (home.files.length) {
    html += "<h2>Changed last</h2><div class=\"list\">";
    html += home.files.slice(0, 12).map((f) => docRow(f.path, f.mtime)).join("");
    html += "</div>";
  }
  html += "<h2>Browse</h2><div class=\"list\">";
  html += row({ href: folderHref(""), kind: "folder", name: "Documents" });
  html += "</div>";
  view.innerHTML = html;
}

function renderFolder() {
  const dir = folder.dir;
  const parts = dir ? dir.split("/") : [];
  let crumbs = `<nav class="crumbs"><a href="#">Home</a><span class="sep">›</span>`;
  crumbs += parts.length ? `<a href="${folderHref("")}">Documents</a>` : `<span class="here">Documents</span>`;
  parts.forEach((part, i) => {
    const path = parts.slice(0, i + 1).join("/");
    crumbs += `<span class="sep">›</span>`;
    crumbs += i === parts.length - 1 ? `<span class="here">${esc(part)}</span>` : `<a href="${folderHref(path)}">${esc(part)}</a>`;
  });
  if (dir) {
    crumbs += `<button class="star${folder.favorite ? " on" : ""}" data-path="${esc(dir)}" aria-label="Favourite">${ICON.star}</button>`;
  }
  crumbs += "</nav>";
  const rows = folder.entries.map((e) => {
    const path = dir ? `${dir}/${e.name}` : e.name;
    return e.dir
      ? row({ href: folderHref(path), kind: "folder", name: e.name, star: { path, on: isFavorite(path) } })
      : row({ href: `/v/${enc(path)}`, kind: "doc", name: stem(e.name), when: when(e.mtime) });
  });
  view.innerHTML = crumbs + `<div class="list">${rows.join("") || '<div class="hint">No folders and no Typst documents here.</div>'}</div>`;
}

function renderSearch() {
  const words = fold(q.value).split(/\s+/).filter(Boolean);
  const hits = home.files.filter((f) => {
    const text = fold(f.path);
    return words.every((w) => text.includes(w));
  });
  view.innerHTML = `<h2>${hits.length ? "Documents" : "Nothing found"}</h2>` +
    (hits.length ? `<div class="list">${hits.slice(0, 60).map((f) => docRow(f.path, f.mtime)).join("")}</div>`
      : '<div class="list"><div class="hint">No document in the favourites has all these words in its path.</div></div>');
}

const route = () => {
  const m = location.hash.match(/^#\/browse\/?(.*)$/);
  return m ? { browse: decodeURIComponent(m[1]) } : {};
};

async function render() {
  clearTimeout(retry);
  try {
    const { browse } = route();
    if (!home || q.value.trim() === "" && browse === undefined) {
      home = await api("/api/home");
    }
    if (q.value.trim()) {
      renderSearch();
    } else if (browse !== undefined) {
      folder = await api(`/api/list?dir=${encodeURIComponent(browse)}`);
      renderFolder();
    } else {
      renderHome();
    }
    showStatus(null);
  } catch (err) {
    if (err instanceof Unreachable) {
      showStatus(`${err.message} Trying again…`);
      retry = setTimeout(render, 5000);
    } else if (route().browse !== undefined) {
      location.hash = "#";
    } else {
      showStatus(`Something went wrong: ${err.message}`);
    }
  }
}

view.addEventListener("click", async (event) => {
  const star = event.target.closest(".star");
  if (!star) return;
  event.preventDefault();
  event.stopPropagation();
  const on = !star.classList.contains("on");
  star.classList.toggle("on", on);
  try {
    const res = await api("/api/favorite", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: star.dataset.path, on }),
    });
    home = await api("/api/home");
    if (folder && folder.dir === star.dataset.path) folder.favorite = on;
    star.classList.toggle("on", res.favorites.includes(star.dataset.path));
    if (route().browse === undefined && !q.value.trim()) renderHome();
  } catch (err) {
    star.classList.toggle("on", !on);
    showStatus(err instanceof Unreachable ? err.message : `Not saved: ${err.message}`);
  }
});

q.addEventListener("input", render);
q.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    const first = view.querySelector("a.row.doc");
    if (first) location.href = first.href;
  }
});
window.addEventListener("hashchange", () => {
  q.value = "";
  render();
  window.scrollTo(0, 0);
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    home = null;
    render();
  }
});
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    home = null;
    render();
  }
});
render();
</script>
</body>
</html>
